<script>
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxy45I4j-Z5Weu8IHSburgFbN1pYRBPJGaN6H7-v7H_xkznTshuZhrQT5SCpPdx_Zp/exec';

    let datosGlobales = [];
    let chartInstance = null;
    let modoVista = 'actual';

    function cargarDatos() {
      // Definimos la función global que procesará la respuesta de Apps Script
      window.handleAppsScriptData = function(json) {
        if (json && !json.error) {
          datosGlobales = json;
          document.getElementById('errorBanner').style.display = 'none';
          renderizar();
        } else {
          console.error("Error retornado por Apps Script:", json ? json.error : "Respuesta vacía");
          document.getElementById('errorBanner').style.display = 'block';
        }
      };

      // Limpiar llamadas previas si existieran
      const scriptViejo = document.getElementById('script-jsonp');
      if (scriptViejo) scriptViejo.remove();

      // Inyectar etiqueta de script para bypass de CORS vía JSONP
      const script = document.createElement('script');
      script.id = 'script-jsonp';
      script.src = APPS_SCRIPT_URL + '?callback=handleAppsScriptData&_=' + new Date().getTime();
      
      script.onerror = function() {
        console.error("Error de red al intentar cargar el script de Google");
        document.getElementById('errorBanner').style.display = 'block';
      };

      document.body.appendChild(script);
    }

    function cambiarVista(modo) {
      modoVista = modo;
      document.getElementById('btnActual').classList.toggle('active', modo === 'actual');
      document.getElementById('btnHistorico').classList.toggle('active', modo === 'historico');
      renderizar();
    }

    function renderizar() {
      if (!datosGlobales || !datosGlobales.length) return;

      const fechasValidas = datosGlobales.map(d => d.fecha).filter(Boolean);
      const ultimaFecha = fechasValidas[fechasValidas.length - 1] || "";
      const partesUltima = ultimaFecha.split('-');
      const mesObjetivo = partesUltima[1];
      const anioObjetivo = partesUltima[2];

      let datosFiltrados = datosGlobales;
      if (modoVista === 'actual' && mesObjetivo && anioObjetivo) {
        datosFiltrados = datosGlobales.filter(d => {
          if (!d.fecha) return false;
          const partes = d.fecha.split('-');
          return partes[1] === mesObjetivo && partes[2] === anioObjetivo;
        });
      }

      let totCafes = 0, totFacturas = 0, totSandwiches = 0, totPromo = 0, totFastFood = 0;
      let rankingMap = {};

      datosFiltrados.forEach(d => {
        const c = Number(d.cafes) || 0;
        const f = Number(d.facturas) || 0;
        const s = Number(d.sandwiches) || 0;
        const p = Number(d.promo39) || 0;
        const ff = Number(d.fastFood) || 0;

        totCafes += c;
        totFacturas += f;
        totSandwiches += s;
        totPromo += p;
        totFastFood += ff;

        const totalFila = c + f + s + p + ff;
        const playeros = [d.playero1, d.playero2].filter(Boolean);
        if (playeros.length > 0) {
          const cuota = totalFila / playeros.length;
          playeros.forEach(pl => {
            rankingMap[pl] = (rankingMap[pl] || 0) + cuota;
          });
        }
      });

      const diasCount = Math.max(new Set(datosFiltrados.map(d => d.fecha)).size, 1);

      document.getElementById('uCafes').innerText = totCafes;
      document.getElementById('uCafesAcum').innerText = totCafes;
      document.getElementById('uCafesProm').innerText = (totCafes / diasCount).toFixed(1) + '/día';

      document.getElementById('uFacturas').innerText = totFacturas;
      document.getElementById('uFacturasAcum').innerText = totFacturas;
      document.getElementById('uFacturasProm').innerText = (totFacturas / diasCount).toFixed(1) + '/día';

      document.getElementById('uSandwiches').innerText = totSandwiches;
      document.getElementById('uSandwichesAcum').innerText = totSandwiches;
      document.getElementById('uSandwichesProm').innerText = (totSandwiches / diasCount).toFixed(1) + '/día';

      document.getElementById('uPromo').innerText = totPromo;
      document.getElementById('uPromoAcum').innerText = totPromo;
      document.getElementById('uPromoProm').innerText = (totPromo / diasCount).toFixed(1) + '/día';

      document.getElementById('uFastFood').innerText = totFastFood;
      document.getElementById('uFastFoodAcum').innerText = totFastFood;
      document.getElementById('uFastFoodProm').innerText = (totFastFood / diasCount).toFixed(1) + '/día';

      const rankingSorted = Object.entries(rankingMap).sort((a, b) => b[1] - a[1]);
      const tbody = document.getElementById('tablaRanking');
      tbody.innerHTML = '';
      rankingSorted.forEach(([nombre, cant], index) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td><b>${index + 1}</b></td><td>${nombre}</td><td>${Math.round(cant)} u.</td>`;
        tbody.appendChild(tr);
      });

      renderizarGrafico(datosFiltrados);
    }

    function renderizarGrafico(datos) {
      const ctx = document.getElementById('chartVentas').getContext('2d');
      
      const agrupado = {};
      datos.forEach(d => {
        const total = (Number(d.cafes)||0) + (Number(d.facturas)||0) + (Number(d.sandwiches)||0) + (Number(d.promo39)||0) + (Number(d.fastFood)||0);
        agrupado[d.fecha] = (agrupado[d.fecha] || 0) + total;
      });

      const labels = Object.keys(agrupado);
      const values = Object.values(agrupado);

      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: 'Unidades Vendidas',
            data: values,
            borderColor: '#38bdf8',
            backgroundColor: 'rgba(56, 189, 248, 0.1)',
            fill: true,
            tension: 0.3
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } },
            y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } }
          }
        }
      });
    }

    // Iniciar la carga
    cargarDatos();
  </script>
